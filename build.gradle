plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Parchment mappings plugin - provides human-readable parameter names
    // Note: Requires Java 17-21. Uncomment when using compatible Java version:
    // id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // Use parchment mappings for human-readable parameter names
    mappings channel: mappings_channel, version: mappings_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output directories before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    copyIdeResources = true

    // Default run configurations.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft.runs.gameTestServer.mods."${mod_id}".source sourceSets.gameTest
minecraft.runs.gameTestServer.workingDirectory project.file('build/gametest-run')

def prepareGameTestWorkingDirectory = tasks.register('prepareGameTestWorkingDirectory', Sync) {
    from 'src/gametest/resources/gameteststructures'
    into layout.buildDirectory.dir('gametest-run/gameteststructures')
}

def gameTestRunLog = layout.buildDirectory.file('gametest/runGameTestServer.log')
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestWorkingDirectory
    doFirst {
        def logFile = gameTestRunLog.get().asFile
        logFile.parentFile.mkdirs()
        ext.gameTestLogStream = new FileOutputStream(logFile, false)
        ext.gameTestTeeStream = new org.apache.tools.ant.util.TeeOutputStream(
                System.out, ext.gameTestLogStream)
        standardOutput = ext.gameTestTeeStream
        errorOutput = ext.gameTestTeeStream
    }
    doLast {
        ext.gameTestTeeStream.flush()
        ext.gameTestLogStream.close()
        def output = gameTestRunLog.get().asFile.text
        def passed = output =~ /All (\d+) required tests passed :\)/
        if (!passed.find() || passed.group(1).toInteger() == 0) {
            throw new GradleException(
                    "GameTest server did not report a nonzero passing test count; see ${gameTestRunLog.get().asFile}")
        }
    }
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    flatDir {
        dir 'libs'
    }
    
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.theillusivec4.top/" }
    
    // JEI (Just Enough Items) for recipe viewing
    maven { url = "https://maven.blamejared.com" }
}

dependencies {
    // Specify the version of Minecraft to use.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curios API (replacement for Baubles in 1.20.1)
    // API for compile only - Curios has mixin issues with official mappings in dev environment
    // The mod works without Curios installed (CuriosCompat handles this gracefully)
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    // Uncomment for runtime testing with Curios (requires SRG mappings):
    // runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    
    // JEI (Just Enough Items) for recipe viewing in dev environment
    // API for compile, full mod for runtime
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.2.0.27")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.2.0.27")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.2.0.27")

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, have it run on every resource process
tasks.named("processResources").configure { dependsOn generateModMetadata }

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
